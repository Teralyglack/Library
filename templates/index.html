<!DOCTYPE html>
<html>
<head>
    <title>Mini Library</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <h1>📚 Mini Library</h1>
        
        <div class="add-book">
            <h2>Add New Book</h2>
            <input type="text" id="title" placeholder="Book Title" required>
            <input type="text" id="author" placeholder="Author Name" required>
            <input type="text" id="year" placeholder="Publication Year" required>
            <button onclick="addBook()">Add Book</button>
        </div>
        
        <div id="book-list">
            <h2>My Books</h2>
            <div id="books"></div>
        </div>
    </div>

    <script>
        async function addBook() {
    const title = document.getElementById('title').value;
    const author = document.getElementById('author').value;
    const year = document.getElementById('year').value;
    body: JSON.stringify({title, author, year})

    if (!title || !author) {
        alert('Please fill all fields');
        return;
    }
    
    const response = await fetch('/api/books', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({title, author})
    });
    
    if (response.ok) {
        document.getElementById('title').value = '';
        document.getElementById('author').value = '';
        loadBooks();
    }
}

async function loadBooks() {
    const response = await fetch('/api/books');
    const books = await response.json();
    displayBooks(books);
}

function displayBooks(books) {
    const container = document.getElementById('books');
    if (books.length === 0) {
        container.innerHTML = '<p>No books yet. Add your first book!</p>';
        return;
    }
    
    container.innerHTML = books.map(book => `
        <div class="book-item">
            <div class="book-info">
                <strong>"${book.title}"</strong> by ${book.author} (${book.year})
            </div>
            <button onclick="deleteBook(${book.id})" class="delete-btn">Delete</button>
        </div>
    `).join('');
}

async function deleteBook(id) {
    if (confirm('Delete this book?')) {
        await fetch(`/api/books/${id}`, {method: 'DELETE'});
        loadBooks();
    }
}

// Загрузить книги при загрузке страницы
loadBooks();

    </script>
</body>
</html>
